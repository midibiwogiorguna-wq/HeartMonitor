name: Build HeartMonitor

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Geode Android mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: HeartMonitor-Android
          path: '**/*.geode'
          if-no-files-found: error
